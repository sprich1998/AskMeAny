services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: teachmeany
      POSTGRES_PASSWORD: teachmeany
      POSTGRES_DB: teachmeany
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../../infra/postgres/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ../../../infra/postgres/init:/docker-entrypoint-initdb.d/init:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teachmeany -d teachmeany"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ../../..
      dockerfile: docker/standalone/backend/Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://teachmeany:teachmeany@postgres:5432/teachmeany
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
      EMBEDDING_VECTOR_SIZE: "768"
      WORKFLOW_EXTRACT_ON_STOP: "true"
      MIGRATIONS_DIR: /app/infra/postgres/migrations
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    restart: on-failure

  browser-worker:
    build:
      context: ../../..
      dockerfile: docker/standalone/browser-worker/Dockerfile
    shm_size: "2gb"
    ports:
      - "6080:6080"
    environment:
      BACKEND_URL: http://backend:4000
      REDIS_URL: redis://redis:6379
      VNC_PUBLIC_HOST: ${VNC_PUBLIC_HOST:-localhost}
      VNC_PUBLIC_PORT: "6080"
      DISPLAY: ":99"
      HEADLESS: "false"
      ENABLE_VNC: "true"
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started
    restart: on-failure

  embedding-worker:
    build:
      context: ../../..
      dockerfile: docker/standalone/embedding-worker/Dockerfile
    environment:
      DATABASE_URL: postgres://teachmeany:teachmeany@postgres:5432/teachmeany
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
      EMBEDDING_VECTOR_SIZE: "768"
    depends_on:
      - postgres
      - redis
      - qdrant
      - backend

  frontend:
    build:
      context: ../../..
      dockerfile: docker/standalone/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_WS_URL: ws://localhost:4000/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
